<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <style>
    /* CodePen 원본 스타일 기반 + 수정된 디자인 */
    @import url('https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap');

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Montserrat', sans-serif;
    }

    .player {
      width: 300px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .album-art {
      width: 150px;
      height: 150px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 5px 0;
    }

    .artist-name {
      font-size: 13px;
      color: #888;
      margin-bottom: 15px;
    }

    audio {
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="player">
    <div class="album-art">
      <img src="cover.png" alt="앨범 커버">
    </div>
    <div class="song-title">너와의 거리, 30cm</div>
    <div class="artist-name">Um minkyung</div>
    <audio controls>
      <source src="MP3.mp3" type="audio/mpeg">
      브라우저가 audio 요소를 지원하지 않습니다.
    </audio>
  </div>

</body>
</html>
