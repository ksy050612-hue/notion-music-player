<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <style>
    @import url("https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700");
    @import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css");

    *, *:before, *:after {
      box-sizing: border-box;
    }

    html, body {
      background: #fffcf5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: "Open Sans", sans-serif;
      overflow: hidden;
    }

    #player-bg-artwork {
      position: fixed;
      inset: -30px;
      background-image: url("cover.png");
      background-size: cover;
      background-position: center;
      filter: blur(40px);
      z-index: 1;
    }

    #player-bg-layer {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0.6;
      z-index: 2;
    }

    .icon:hover {
      cursor: pointer;
    }

    #app-cover {
      position: relative;
      width: 430px;
      height: 100px;
      z-index: 3;
      /* 위젯 전체 위치를 위쪽으로 올려서 중앙에 맞춤 */
      margin-top: 40px; 
    }

    #player {
      position: relative;
      height: 100%;
      z-index: 2;
    }

    #player-track {
      position: absolute;
      top: 0;
      right: 15px;
      left: 15px;
      padding: 13px 22px 14px 184px;
      background-color: #fffbeb;
      border-radius: 15px 15px 0 0;
      transition: 0.3s ease top;
      z-index: 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    #player-track.active {
      top: -100px;
    }

    #album-name {
      color: #54576f;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #track-name {
      color: #acaebd;
      font-size: 12px;
      margin: 2px 0 8px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #track-time
