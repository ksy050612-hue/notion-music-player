<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <style>
    @import url("https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700");
    @import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css");

    html, body {
      background: #fffcf5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: "Open Sans", sans-serif;
      overflow: hidden;
      /* 플레이어가 위로 올라갈 때 위쪽이 잘리지 않도록 전체 여백 살짝 조정 */
      padding-top: 40px; 
    }

    #player-bg-artwork {
      position: fixed;
      inset: -30px;
      background-image: url("cover.png");
      background-size: cover;
      background-position: center;
      filter: blur(40px);
      z-index: 1;
    }

    #player-bg-layer {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0.6;
      z-index: 2;
    }

    .icon:hover {
      cursor: pointer;
    }

    #app-cover {
      position: relative;
      width: 300px;
      height: 100px;
      z-index: 3;
      /* 기본 위치를 아래쪽으로 살짝 내려서 전체 중심을 맞춤 */
      margin-top: 30px; 
    }

    #player {
      position: relative;
      height: 100%;
      z-index: 2;
    }

    #player-track {
      position: absolute;
      top: 0;
      right: 15px;
      left: 15px;
      padding: 13px 22px 10px 184px;
      background-color: #fffbeb;
      border-radius: 15px 15px 0 0;
      transition: 0.3s ease top;
      z-index: 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    #player-track.active {
      top: -55px; /* 올라가는 높이를 조절하여 위로 너무 쏠리지 않도록 함 */
    }

    #album-name {
      color: #54576f;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #track-name {
      color: #acaebd;
      font-size: 12px;
      margin: 2px 0 13px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #track-time {
      position: relative;
      margin-bottom: 6px;
      overflow: hidden;
    }

    #current-time {
      float: left;
    }

    #track-length {
      float: right;
    }

    #current-time, #track-length {
      color: transparent;
      font-size: 11px;
      background-color: #fef3c7;
      border-radius: 10px;
      transition: 0.3s color 0.1s;
    }

    #player-track.active #current-time, #player-track.active #track-length {
      color: #d97706;
      background-color: transparent;
    }

    #s-area, #seek-bar {
      position: relative;
      height: 4px;
      border-radius: 4px;
    }

    #s-area {
      background-color: #fef3c7;
      cursor: pointer;
    }

    #ins-time {
      position: absolute;
      top: -29px;
      color: #fff;
      font-size: 12px;
      white-space: pre;
      padding: 5px 6px;
      border-radius: 4px;
      display: none;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.6);
    }

    #s-hover {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.1);
    }

    #seek-bar {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      background-color: #f59e0b;
      transition: 0.1s width linear;
    }

    #player-content {
      position: relative;
      height: 100%;
      background-color: #fff;
      box-shadow: 0 30px 80px rgba(217, 119, 6, 0.2);
      border-radius: 15px;
      z-index: 2;
    }

    #album-art {
      position: absolute;
      top: -40px;
      left: 15px;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      box-shadow: 0 0 0 10px #fff, 0 30px 50px rgba(0, 0, 0, 0.2);
      transform: rotate(0deg);
      transition: 0.3s ease all;
      z-index: 3;
    }

    #album-art.active {
      top: -50px;
      box-shadow: 0 0 0 13px #fffbeb, 0 30px 50px rgba(217, 119, 6, 0.2);
    }

    #album-art img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    #album-art.active img.active {
      animation: rotateAlbumArt 3s linear 0s infinite forwards;
    }

    @keyframes rotateAlbumArt {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #buffer-box {
      position: absolute;
      top: 50%;
      right: 0;
      left: 0;
      height: 13px;
      color: #b3b3b3;
      font-size: 13px;
      font-family: Helvetica;
      text-align: center;
      font-weight: bold;
      line-height: 1;
      padding: 0;
      margin: -7px 0 0 0;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s linear all;
      z-index: 2;
    }

    #album-art.buffering #buffer-box {
      opacity: 1;
      visibility: visible;
    }

    #player-controls {
      position: absolute;
      top: 10px;
      right: 15px;
      width: 150px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .control {
      margin: 0 10px;
    }

    .button {
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border-radius: 50%;
      color: #f59e0b;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }

    .button i {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div id="player-bg-artwork"></div>
  <div id="player-bg-layer"></div>

  <div id="app-cover">
    <div id="player">
      <div id="player-track">
        <div id="album-name">너와의 거리, 30cm</div>
        <div id="track-name">Um minkyung</div>
        <div id="track-time">
          <div id="current-time">00:00</div>
          <div id="track-length">00:00</div>
          <div id="s-area">
            <div id="ins-time"></div>
            <div id="s-hover"></div>
            <div id="seek-bar"></div>
          </div>
        </div>
      </div>
      <div id="player-content">
        <div id="album-art">
          <img src="cover.png" id="cover-art" alt="앨범 커버" class="">
          <div id="buffer-box">Buffering ...</div>
        </div>
        <div id="player-controls">
          <div class="control">
            <div class="button" id="play-pause-button">
              <i class="fa fa-play"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var playerTrack = document.querySelector('#player-track'),
          albumArt = document.querySelector('#album-art'),
          sArea = document.querySelector('#s-area'),
          seekBar = document.querySelector('#seek-bar'),
          currentTimeLoc = document.querySelector('#current-time'),
          seekTimeLoc = document.querySelector('#track-length'),
          playPauseButton = document.querySelector('#play-pause-button'),
          i = document.querySelector('#play-pause-button i'),
          coverArt = document.querySelector('#cover-art'),
          audio = new Audio('MP3.mp3');

      function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "00:00";
        var min = Math.floor(seconds / 60);
        var sec = Math.floor(seconds % 60);
        return (min < 10 ? "0" + min : min) + ":" + (sec < 10 ? "0" + sec : sec);
      }

      function playPause() {
        if (audio.paused) {
          playerTrack.classList.add('active');
          albumArt.classList.add('active');
          coverArt.classList.add('active');
          audio.play();
          i.setAttribute('class', 'fa fa-pause');
        } else {
          playerTrack.classList.remove('active');
          albumArt.classList.remove('active');
          coverArt.classList.remove('active');
          audio.pause();
          i.setAttribute('class', 'fa fa-play');
        }
      }

      playPauseButton.addEventListener('click', playPause);

      audio.addEventListener('timeupdate', function() {
        currentTimeLoc.textContent = formatTime(audio.currentTime);
        seekTimeLoc.textContent = formatTime(audio.duration);
        var percentage = (audio.currentTime / audio.duration) * 100;
        if (isNaN(percentage)) percentage = 0;
        seekBar.style.width = percentage + '%';

        if (audio.currentTime === audio.duration) {
          i.setAttribute('class', 'fa fa-play');
          seekBar.style.width = '0%';
          currentTimeLoc.textContent = '00:00';
          playerTrack.classList.remove('active');
          albumArt.classList.remove('active');
          coverArt.classList.remove('active');
        }
      });

      audio.addEventListener('loadedmetadata', function() {
        seekTimeLoc.textContent = formatTime(audio.duration);
      });

      sArea.addEventListener('click', function(event) {
        var rect = sArea.getBoundingClientRect();
        var clickPosition = (event.clientX - rect.left) / rect.width;
        if (Number.isFinite(audio.duration)) {
          audio.currentTime = clickPosition * audio.duration;
          seekBar.style.width = (clickPosition * 100) + '%';
        }
      });
    });
  </script>

</body>
</html>
