
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vinyl Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: transparent;
  font-family: Arial, sans-serif;
  color: #ffffff;
}

.player {
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
  padding: 24px;
  border-radius: 18px;
  background: #202020;
  text-align: center;
}

.vinyl {
  width: 190px;
  height: 190px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: repeating-radial-gradient(
    circle,
    #181818 0px,
    #292929 2px,
    #151515 4px,
    #222222 6px
  );
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 18px rgba(0,0,0,0.45);
  animation: rotate 5s linear infinite;
  animation-play-state: paused;
  position: relative;
}

.vinyl.playing {
  animation-play-state: running;
}

.vinyl::before {
  content: "";
  position: absolute;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #171717;
  z-index: 2;
}

.album {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  object-fit: cover;
  z-index: 1;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.song-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 6px;
}

.artist {
  color: #aaaaaa;
  font-size: 12px;
  margin-bottom: 22px;
}

.progress {
  width: 100%;
  accent-color: #ffffff;
  cursor: pointer;
}

.time {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #aaaaaa;
  margin-top: 4px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 20px;
}

.play-button {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #ffffff;
  color: #171717;
  font-size: 20px;
  cursor: pointer;
}

.play-button:active {
  transform: scale(0.94);
}

@media (max-width: 400px) {
  body { padding: 10px; }
  .player { padding: 20px; }
  .vinyl { width: 165px; height: 165px; }
  .album { width: 80px; height: 80px; }
}
</style>
</head>

<body>

<div class="player">

  <div class="vinyl" id="vinyl">
    <img src="cover.png" class="album" alt="Album cover">
  </div>

  <div class="song-title">My Favorite Song</div>
  <div class="artist">Now Playing</div>

  <audio id="audio" preload="metadata">
    <source src="MP3.mp3" type="audio/mpeg">
  </audio>

  <input
    type="range"
    class="progress"
    id="progress"
    value="0"
    min="0"
    max="100"
  >

  <div class="time">
    <span id="current">0:00</span>
    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button class="play-button" id="playButton" aria-label="재생">▶</button>
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const vinyl = document.getElementById("vinyl");
const playButton = document.getElementById("playButton");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return min + ":" + String(sec).padStart(2, "0");
}

playButton.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      console.error("음악 재생 실패:", error);
    }
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  vinyl.classList.add("playing");
  playButton.textContent = "Ⅱ";
  playButton.setAttribute("aria-label", "일시정지");
});

audio.addEventListener("pause", () => {
  vinyl.classList.remove("playing");
  playButton.textContent = "▶";
  playButton.setAttribute("aria-label", "재생");
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = (audio.currentTime / audio.duration) * 100;
  }

  current.textContent = formatTime(audio.currentTime);
});

progress.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
});

audio.addEventListener("ended", () => {
  progress.value = 0;
});
</script>

</body>
</html>
