<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music Player</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fffcf5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 50px;
}

#player-bg-artwork {
  position: fixed;
  inset: -30px;
  background-image: url("cover.png");
  background-size: cover;
  background-position: center;
  filter: blur(40px);
  z-index: 1;
}

#player-bg-layer {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: .6;
  z-index: 2;
}

#player-container {
  position: relative;
  z-index: 3;
  width: min(430px, calc(100vw - 30px));
  height: 100px;
  margin: 40px auto;
}

#player {
  position: relative;
  width: 100%;
  height: 100%;
}

/* 정지 상태: 트랙바가 아래로 튀어나오지 않고 카드 상단에 깔끔하게 위치 */
#player-track {
  position: absolute;
  top: 0;
  left: 15px;
  right: 15px;
  padding: 13px 20px 10px 184px;
  background: #fffbeb;
  border-radius: 15px 15px 0 0;
  transition: top .3s ease;
  z-index: 1; 
}

/* 재생 상태: 너무 높지 않고 적당한 높이(-48px)로 쏙 올라오며 레이어가 위로 옴 */
#player-track.active {
  top: -48px;
  z-index: 10;
}

#album-name {
  color: #54576f;
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#track-name {
  color: #acaebd;
  font-size: 13px;
  margin: 3px 0 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#track-time {
  height: 12px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #d97706;
}

#seek-bar-container {
  position: relative;
  height: 4px;
  background: #fef3c7;
  border-radius: 4px;
  cursor: pointer;
  touch-action: pan-y;
}

#seek-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 0%;
  height: 100%;
  background: #f59e0b;
  border-radius: 4px;
}

#player-content {
  position: relative;
  height: 100%;
  background: white;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
  border-radius: 15px;
  z-index: 5;
}

#album-art {
  position: absolute;
  top: -40px;
  width: 115px;
  height: 115px;
  margin-left: 40px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 0 10px white;
  transition: .3s ease;
  z-index: 12;
}

#album-art.active {
  top: -48px;
  box-shadow: 0 0 0 4px #fffbeb,
              0 30px 50px -15px rgba(217, 119, 6, 0.2);
}

#album-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#album-art.active img {
  animation: rotateAlbumArt 10s linear infinite;
}

@keyframes rotateAlbumArt {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

#album-art::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #d6dee7;
  border: 2px solid white;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

#player-controls {
  height: 100%;
  margin-left: 141px;
  display: flex;
  align-items: center;
  justify-content: space-around;
}

.control {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
}

.button {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  background: white;
  border: none;
  color: #d6dee7;
  font-size: 25px;
  cursor: pointer;
  transition: .2s;
}

.button:hover {
  background: #f3f4f6;
  color: #9ca3af;
}

#play-pause-button {
  font-size: 27px;
}

#play-pause-button.playing {
  color: #d97706;
}

#message {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 115px;
  color: #777;
  font-size: 11px;
}

@media (max-width: 480px) {
  #player-container {
    width: calc(100vw - 24px);
    height: 90px;
  }

  #player-track {
    padding-left: 125px;
    padding-right: 12px;
  }

  #player-track.active {
    top: -45px;
  }

  #album-art {
    width: 90px;
    height: 90px;
    margin-left: 25px;
    top: -25px;
  }

  #album-art.active {
    top: -35px;
  }

  #player-controls {
    margin-left: 112px;
  }

  .button {
    width: 48px;
    height: 55px;
    font-size: 21px;
  }

  #album-name {
    font-size: 14px;
  }

  #track-name {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div id="player-bg-artwork"></div>
<div id="player-bg-layer"></div>

<div id="player-container">
  <div id="player">

    <div id="player-track">
      <div id="album-name">너와의 거리, 30cm</div>
      <div id="track-name">Um minkyung</div>

      <div id="track-time">
        <span id="current-time">00:00</span>
        <span id="track-length">00:00</span>
      </div>

      <div id="seek-bar-container">
        <div id="seek-bar"></div>
      </div>
    </div>

    <div id="player-content">

      <div id="album-art">
        <img src="cover.png" alt="Album cover">
      </div>

      <div id="player-controls">
        <div class="control">
          <button class="button" id="previous" aria-label="처음으로">
            ↶
          </button>
        </div>

        <div class="control">
          <button class="button" id="play-pause-button"
                  aria-label="재생">
            ▶
          </button>
        </div>

        <div class="control">
          <button class="button" id="next" aria-label="처음으로">
            ↻
          </button>
        </div>
      </div>
    </div>

    <div id="message"></div>
  </div>
</div>

<audio id="audio" preload="metadata">
  <source src="MP3.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const playButton = document.getElementById("play-pause-button");
const albumArt = document.getElementById("album-art");
const playerTrack = document.getElementById("player-track");
const seekBar = document.getElementById("seek-bar");
const seekArea = document.getElementById("seek-bar-container");
const currentTime = document.getElementById("current-time");
const trackLength = document.getElementById("track-length");
const message = document.getElementById("message");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "00:00";
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return String(min).padStart(2, "0") + ":" +
         String(sec).padStart(2, "0");
}

function updateButton() {
  const playing = !audio.paused;
  playButton.textContent = playing ? "Ⅱ" : "▶";
  playButton.classList.toggle("playing", playing);
  playButton.setAttribute("aria-label",
    playing ? "일시정지" : "재생");
  albumArt.classList.toggle("active", playing);
  playerTrack.classList.toggle("active", playing);
}

playButton.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
      message.textContent = "";
    } catch (error) {
      message.textContent =
        "재생할 수 없습니다. MP3 파일을 확인해 주세요.";
      console.error(error);
    }
  } else {
    audio.pause();
  }
  updateButton();
});

audio.addEventListener("loadedmetadata", () => {
  trackLength.textContent = formatTime(audio.duration);
  message.textContent = "";
});

audio.addEventListener("timeupdate", () => {
  currentTime.textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    seekBar.style.width =
      (audio.currentTime / audio.duration * 100) + "%";
  }
});

audio.addEventListener("error", () => {
  message.textContent =
    "음악 파일을 불러오지 못했습니다. 파일 경로를 확인해 주세요.";
});

audio.addEventListener("ended", () => {
  audio.currentTime = 0;
  updateButton();
});

seekArea.addEventListener("click", (event) => {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

  const rect = seekArea.getBoundingClientRect();
  const position = (event.clientX - rect.left) / rect.width;

  audio.currentTime = Math.max(
    0, Math.min(1, position)
  ) * audio.duration;
});

document.getElementById("previous").addEventListener("click", () => {
  audio.currentTime = 0;
});

document.getElementById("next").addEventListener("click", () => {
  audio.currentTime = 0;
  if (!audio.paused) audio.play();
});

audio.addEventListener("play", updateButton);
audio.addEventListener("pause", updateButton);
</script>

</body>
</html>
